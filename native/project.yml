# XcodeGen spec for the native app. GrabberNative.xcodeproj is generated from this (the just recipes run
# `xcodegen` first) and is not committed: a new Swift file under App/ needs no project edit.
name: GrabberNative
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  ContextCore:
    path: ContextCore
settings:
  base:
    DEVELOPMENT_TEAM: 45P6D3439T
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Overridden on the xcodebuild line by the just recipes; Info.plist carries them to BuildInfo.
    GIT_SHA: dev
    GIT_BRANCH: dev
targets:
  GrabberNative:
    type: application
    platform: iOS
    sources:
      - App
      # The Live Activity's attributes, compiled into the widget extension too.
      - Shared
      # The Gym Timer's cues and keepalive loop, shared with the React Native app until the cutover.
      - path: ../assets/audio/timer
        excludes:
          - "words/**"
        buildPhase: resources
      # The breathing screen's six spoken phrases (scripts/make-breath-words.sh).
      - path: ../assets/audio/breathe
        buildPhase: resources
      # The other count voices (story 182): <voice>-<cue>.wav, rendered by scripts/make-timer-voice.sh.
      - path: ../assets/audio/timer-voices
        buildPhase: resources
      # The mirror's fixture week, for the simulator hook (GRABBER_MIRROR); the host tests read the same file.
      - path: ContextCore/Tests/ContextCoreTests/Fixtures/mirror-fixture.json
        buildPhase: resources
    # Health: the mirror reads it (step 4). XcodeGen writes the file from these properties.
    entitlements:
      path: GrabberNative.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    dependencies:
      - package: ContextCore
      - target: GrabberWidgets
    settings:
      base:
        # Its own id until the cutover, so it installs beside Context Grabber (story 140).
        PRODUCT_BUNDLE_IDENTIFIER: com.idvorkin.grabbernative
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Grabber Native
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  # The widget extension: for now only the Gym Timer's Live Activity (story 106).
  GrabberWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idvorkin.grabbernative.widgets
        INFOPLIST_FILE: Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Grabber Native
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  # Simulator only: grants Health access through Health's own sheet, the one tap a script cannot make
  # (`just native-sim-health`; docs/TESTING.md).
  GrabberNativeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: GrabberNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idvorkin.grabbernative.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GrabberNative
        CODE_SIGN_STYLE: Automatic
schemes:
  GrabberNative:
    build:
      targets:
        GrabberNative: all
    test:
      targets:
        - GrabberNativeUITests
    run:
      config: Debug
