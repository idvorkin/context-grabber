# XcodeGen spec for the native app. GrabberNative.xcodeproj is generated from this (the just recipes run
# `xcodegen` first) and is not committed: a new Swift file under App/ needs no project edit.
name: GrabberNative
options:
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
packages:
  ContextCore:
    path: ContextCore
  # Think a Card Trainer's card screen (#219, the trainer's D15): one screen, two apps. The trainer's private repo,
  # at a tag: a change there reaches this app when the tag here moves.
  ThinkACard:
    url: https://github.com/idvorkin/think-a-card-trainer
    exactVersion: 0.3.10
  # The report dialog, shake, dictation, What's new and iCloud delivery, shared with the other apps. Pinned to a
  # release tag exactly: every app and the Mac's reader must speak the same delivery format (bug-kit's rollout trains).
  BugKit:
    url: https://github.com/idvorkin/bug-kit
    exactVersion: 0.3.18
settings:
  base:
    DEVELOPMENT_TEAM: 45P6D3439T
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Overridden on the xcodebuild line by the just recipes; Info.plist carries them to BuildInfo.
    GIT_SHA: dev
    # The report's commit: `git describe --always --dirty`, set by the justfile's builds; honest when missing.
    BUGKIT_COMMIT: unknown
    GIT_BRANCH: dev
targets:
  GrabberNative:
    type: application
    platform: iOS
    sources:
      - App
      # The Live Activity's attributes, compiled into the widget extension too.
      - Shared
      # The Gym Timer's cues and keepalive loop, shared with the React Native app until the cutover.
      - path: ../assets/audio/timer
        excludes:
          - "words/**"
        buildPhase: resources
      # The breathing screen's six spoken phrases (scripts/make-breath-words.sh).
      - path: ../assets/audio/breathe
        buildPhase: resources
      # The other count voices (stories 182, 187): <voice>-<cue>.wav, rendered by scripts/make-timer-voice.sh.
      - path: ../assets/audio/timer-voices
        buildPhase: resources
      # Story 137: the eulogy song, Igor's download of it from Suno (the post's song as of 2026-10-07).
      - path: ../assets/audio/eulogy
        buildPhase: resources
      # The mirror's fixture week, for the simulator hook (GRABBER_MIRROR); the host tests read the same file.
      - path: ContextCore/Tests/ContextCoreTests/Fixtures/mirror-fixture.json
        buildPhase: resources
    # Health: the mirror reads it (step 4). XcodeGen writes the file from these properties.
    entitlements:
      path: GrabberNative.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Health wakes the app for new heart rate (context-grabber-jimz); without it background delivery fails.
        com.apple.developer.healthkit.background-delivery: true
        # The live tile reads the usage reading the app writes here (story 136).
        com.apple.security.application-groups:
          - group.com.idvorkin.grabbernative
        # Reports go up to Igor's private iCloud for the Mac's listener (story 152): BugKit's shared container.
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.idvorkin.BugKitReports
        # The daily strip on every device signed into Igor's iCloud (#376, story 153).
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        # Story 238: the phone's pairing with Larry's box, one Keychain item every app of Igor's shares (BugKit's
        # PairedDeviceStore). The app's own group stays first, so the pasted ledger key stays this app's.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.idvorkin.grabbernative
          - $(AppIdentifierPrefix)com.idvorkin.paired-device
    dependencies:
      - package: ContextCore
      - package: ThinkACard
        product: ThinkACardCore
      - package: ThinkACard
        product: ThinkACardUI
      - package: BugKit
      # Not in the Mac build (#638): a Mac has no Live Activity or lock screen, and nothing to share from yet.
      - target: GrabberWidgets
        destinationFilters: [iOS]
      - target: GrabberShare
        destinationFilters: [iOS]
    # What's new (story 148): the last month's story commits, made from git log at every build by BugKit's script.
    postBuildScripts:
      # BugKit's checkout is found by walking up from the build folder: an archive's (just testflight, #1012) sits
      # deeper under the derived data than a build's.
      - name: What's new
        script: 'd="$BUILD_DIR"; while [ "$d" != / ] && [ ! -d "$d/SourcePackages/checkouts/bug-kit" ]; do d=$(dirname "$d"); done; "$d/SourcePackages/checkouts/bug-kit/scripts/whats-new.sh" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/whats-new.json" --repo "$SRCROOT/.." --path native --base-url https://github.com/idvorkin/context-grabber/blob/main/docs/stories/ --fixed-reports'
        basedOnDependencyAnalysis: false
        showEnvVars: false
      # The card screen's stack and voice clips, from Igor's Mac, never from this repo (scripts/native/bundle-trainer.sh).
      - name: Bundle the stack and voice
        script: '"$SRCROOT/../scripts/native/bundle-trainer.sh" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" --voice'
        basedOnDependencyAnalysis: false
        showEnvVars: false
    settings:
      base:
        # Its own id until the cutover, so it installs beside Context Grabber (story 140).
        PRODUCT_BUNDLE_IDENTIFIER: com.idvorkin.grabbernative
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Grabber Native
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # The iPad turns every way (story 150); the phone stays upright.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # The Mac build (#638): the same bundle id, so it shares the iCloud store, and its own entitlements (no Health).
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Mac/GrabberNativeMac.entitlements
        # ActivityKit doesn't compile for a Mac: LiveActivityControllerMac.swift stands in.
        "EXCLUDED_SOURCE_FILE_NAMES[sdk=macosx*]": LiveActivityController.swift GrabberActivityAttributes.swift
        # The What's new phase reads the repository's git history and stories, outside what a sandbox allows.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  # The widget extension: the Live Activity (stories 106, 166) and the live tile (story 136).
  GrabberWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    entitlements:
      path: Widgets/GrabberWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.idvorkin.grabbernative
    dependencies:
      - package: ContextCore
      - package: ThinkACard
        product: ThinkACardCore
      - package: ThinkACard
        product: ThinkACardUI
    # Today's hand deals from the same stack (#219).
    postBuildScripts:
      - name: Bundle the stack
        script: '"$SRCROOT/../scripts/native/bundle-trainer.sh" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"'
        basedOnDependencyAnalysis: false
        showEnvVars: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idvorkin.grabbernative.widgets
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_FILE: Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Grabber Native
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  # The share extension (#305, story 038): anything shared from another app lands in the Inbox in the App Group, for
  # the app to send to Larry. Its one network question is which recent chats to offer, and nothing waits for it (#587).
  # BugKit is here for the card's session log and copyable errors, not the reporter, which an extension cannot present.
  # Its errors file themselves into the App Group, for the app to send on (story 157). It has no mic: iOS refused the
  # extension the microphone (#1135, story 546), so the keyboard's dictation key speaks the message.
  GrabberShare:
    type: app-extension
    platform: iOS
    sources:
      - Share
    entitlements:
      path: Share/GrabberShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.idvorkin.grabbernative
    dependencies:
      - package: ContextCore
      - package: BugKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idvorkin.grabbernative.share
        INFOPLIST_FILE: Share/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Grabber Native
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  # Contract tests on real PaperKit and PencilKit (bead 0u3k): what the whiteboard relies on the platform doing, run
  # inside the app on the simulator so they fail on the iOS that changes it (docs/TESTING.md).
  GrabberNativeContractTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ContractTests
    dependencies:
      - target: GrabberNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idvorkin.grabbernative.contracttests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GrabberNative.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/GrabberNative"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
  # Simulator only: grants Health access through Health's own sheet, the one tap a script cannot make
  # (`just native-sim-health`; docs/TESTING.md).
  GrabberNativeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        # The classes that launch the Board Lab instead (story 1501): their files stay here, in BoardLabUITests.
        excludes:
          - WhiteboardEraserUITests.swift
          - WhiteboardTitleRenameUITests.swift
    dependencies:
      - target: GrabberNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idvorkin.grabbernative.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GrabberNative
        CODE_SIGN_STYLE: Automatic
  # The Board Lab (story 1501, plan 2026-11-22-board-lab-plan.md): the app's sources with their own @main, whose only
  # window is the boards list. The same AppModel and board, without the home window or the scene-phase work, so a
  # whiteboard UI test launches less. Simulator only; never installed on a device.
  BoardLab:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - GrabberApp.swift
      - Shared
      - BoardLab
    dependencies:
      - package: ContextCore
      - package: ThinkACard
        product: ThinkACardCore
      - package: ThinkACard
        product: ThinkACardUI
      - package: BugKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idvorkin.grabbernative.boardlab
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Board Lab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGN_STYLE: Automatic
        "EXCLUDED_SOURCE_FILE_NAMES[sdk=macosx*]": LiveActivityController.swift GrabberActivityAttributes.swift
    # Story 1631 (bead context-grabber-3hj9.1): the lab shares the app's Info.plist but must answer none of its links.
    # Two apps claiming grabbernative:// let iOS hand a link to either; the store walk found every warm link in the lab.
    postBuildScripts:
      - name: The lab answers no links
        script: |
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          if /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$plist" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$plist"
          fi
          # PlistBuddy exits 0 when it can't save, so check the key is really gone.
          if /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$plist" >/dev/null 2>&1; then
            echo "error: the lab's Info.plist still declares CFBundleURLTypes ($plist)" >&2
            exit 1
          fi
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
        showEnvVars: false
  # The whiteboard UI test classes that launch the Board Lab (story 1501), with the helpers they share with the app's.
  BoardLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests/WhiteboardEraserUITests.swift
      - UITests/WhiteboardTitleRenameUITests.swift
      - UITests/FastTesting.swift
      - UITests/SettledTap.swift
      # PaperScreen lives here until it has a file of its own (two open PRs edit this one); its tests aren't run here.
      - UITests/WhiteboardPaperGhostsUITests.swift
      - UITests/WhiteboardWordsOnlyFixture.swift
    dependencies:
      - target: BoardLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idvorkin.grabbernative.boardlab.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BoardLab
        CODE_SIGN_STYLE: Automatic
schemes:
  BoardLab:
    build:
      targets:
        BoardLab: all
    test:
      targets:
        - BoardLabUITests
  GrabberNative:
    build:
      targets:
        GrabberNative: all
    test:
      targets:
        - GrabberNativeUITests
        # Story 1501: the whiteboard classes that launch the Board Lab; one scheme runs both, as the scripts expect.
        - BoardLabUITests
        - GrabberNativeContractTests
    run:
      config: Debug
